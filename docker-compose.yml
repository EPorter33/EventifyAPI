name: eventify

services:
  eventifyapi:
    build: .
    container_name: eventifyapi
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=EventifyDB;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eventifydb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - ./db_data:/var/opt/mssql